[package]
name = "edi-parse"
version = "0.1.0"
edition = "2021"
description = "Parse, validate, and summarize X12 835/837P EDI files"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse_bench"
harness = false
