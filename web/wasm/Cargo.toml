[package]
name = "edi-parse-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
edi-parse = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "s"
lto = true

# Not part of the root crate's workspace.
[workspace]
